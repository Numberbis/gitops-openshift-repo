---
# TEMPLATE — Pipeline Flink 24h/24 en mode application.
#
# Copier dans components/streaming-platform/jobs/, adapter, référencer
# dans kustomization.yaml : le job devient un objet GitOps à part
# entière. Tout changement commité (image, parallélisme, config)
# déclenche un upgrade SANS PERTE D'ÉTAT : l'opérateur prend un
# savepoint, arrête le job, redéploie, restaure.
#
# Prérequis :
#   - image custom contenant le jar du pipeline (voir Dockerfile dans
#     README_Flink_Spark.md),
#   - bucket S3 accessible (ODF/MinIO/AWS) pour checkpoints, savepoints
#     et métadonnées HA,
#   - Secret `flink-s3-credentials` (AWS_ACCESS_KEY_ID /
#     AWS_SECRET_ACCESS_KEY) créé hors Git — via External Secrets
#     (ClusterSecretStore `vault` du composant elastic-platform) ou à la
#     main.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: mon-pipeline-flink
  namespace: data-jobs
  labels:
    app.kubernetes.io/part-of: streaming-platform
spec:
  # Image custom : flink:1.20 + le jar du pipeline dans /opt/flink/usrlib.
  image: registry.example.com/data/mon-pipeline-flink:1.0.0
  flinkVersion: v1_20
  serviceAccount: flink

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"

    # ── État & checkpoints : le remplaçant de HDFS ────────────────────
    state.backend.type: rocksdb
    state.backend.incremental: "true"
    execution.checkpointing.interval: 60 s
    execution.checkpointing.mode: EXACTLY_ONCE
    state.checkpoints.dir: s3://flink-state/checkpoints/mon-pipeline
    state.savepoints.dir: s3://flink-state/savepoints/mon-pipeline

    # ── HA JobManager : survit à la perte du pod/nœud sans intervention ─
    high-availability.type: kubernetes
    high-availability.storageDir: s3://flink-state/ha/mon-pipeline

    # ── Endpoint S3 (ODF/MinIO interne) ──────────────────────────────
    s3.endpoint: https://s3.openshift-storage.svc:443   # PLACEHOLDER
    s3.path.style.access: "true"

    # Redémarrages applicatifs (au-delà : l'opérateur prend le relais)
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.max-backoff: 2 min

  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            # Active le filesystem S3 embarqué dans l'image officielle
            # (adapter la version du jar à celle de Flink).
            - name: ENABLE_BUILT_IN_PLUGINS
              value: flink-s3-fs-hadoop-1.20.0.jar
          envFrom:
            - secretRef:
                name: flink-s3-credentials

  jobManager:
    replicas: 1          # la HA k8s permet aussi 2 (actif/passif)
    resource:
      memory: 2048m
      cpu: 1
  taskManager:
    resource:
      memory: 4096m
      cpu: 2

  job:
    jarURI: local:///opt/flink/usrlib/mon-pipeline.jar
    entryClass: com.exemple.MonPipeline
    parallelism: 4
    state: running
    # ★ Le réglage le plus important pour du 24/7 :
    #   savepoint = tout upgrade commité passe par savepoint → restore.
    #   (`last-state` est plus rapide mais reprend du dernier checkpoint.)
    upgradeMode: savepoint
