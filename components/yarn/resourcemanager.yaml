---
# Service headless du ResourceManager : nom DNS stable
# `yarn-resourcemanager-0.yarn-resourcemanager.hadoop.svc.cluster.local`
# référencé par yarn.resourcemanager.hostname (yarn-site.xml).
apiVersion: v1
kind: Service
metadata:
  name: yarn-resourcemanager
  namespace: hadoop
  labels:
    app.kubernetes.io/name: yarn-resourcemanager
    app.kubernetes.io/component: resourcemanager
    app.kubernetes.io/part-of: hadoop
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yarn-resourcemanager
  ports:
    - { name: client,    port: 8032, targetPort: 8032 }   # soumission de jobs
    - { name: scheduler, port: 8030, targetPort: 8030 }   # ApplicationMasters
    - { name: tracker,   port: 8031, targetPort: 8031 }   # heartbeat NodeManagers
    - { name: admin,     port: 8033, targetPort: 8033 }
    - { name: http,      port: 8088, targetPort: 8088 }   # UI web
---
# ResourceManager YARN — 1 replica (non-HA, comme le NameNode : le
# StatefulSet replanifie le pod ; les jobs en cours sont perdus mais
# l'état du cluster se reconstruit via les heartbeats des NodeManagers).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-resourcemanager
  namespace: hadoop
  labels:
    app.kubernetes.io/name: yarn-resourcemanager
    app.kubernetes.io/component: resourcemanager
    app.kubernetes.io/part-of: hadoop
spec:
  serviceName: yarn-resourcemanager
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yarn-resourcemanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yarn-resourcemanager
        app.kubernetes.io/component: resourcemanager
        app.kubernetes.io/part-of: hadoop
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resourcemanager
          image: apache/hadoop:3.4.1
          command: ["yarn", "resourcemanager"]
          env:
            - { name: HADOOP_CONF_DIR, value: /etc/hadoop/conf }
            - { name: HADOOP_USER_NAME, value: hadoop }
            - { name: HADOOP_HEAPSIZE_MAX, value: 1g }
          ports:
            - { name: client,    containerPort: 8032 }
            - { name: scheduler, containerPort: 8030 }
            - { name: tracker,   containerPort: 8031 }
            - { name: admin,     containerPort: 8033 }
            - { name: http,      containerPort: 8088 }
          readinessProbe:
            httpGet: { path: /ws/v1/cluster/info, port: 8088 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ws/v1/cluster/info, port: 8088 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: hadoop-config, mountPath: /etc/hadoop/conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: hadoop-config
          configMap: { name: hadoop-config }
        - name: tmp
          emptyDir: {}
