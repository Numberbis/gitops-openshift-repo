# Job producteur d'événements OTLP JSON → Kafka de test.
#
# Aucune image à construire : deux conteneurs d'images OFFICIELLES partagent
# une FIFO (emptyDir) :
#   * generator : python:3.12-slim exécute produce_otlp.py (ConfigMap), qui
#     écrit « clé<TAB>message » dans la FIFO, au rythme demandé (INTERVAL) ;
#   * producer  : apache/kafka lit la FIFO avec kafka-console-producer.sh
#     (clé = identifiant de campagne → une seule partition, ordre conservé).
# Le Job se termine quand le générateur ferme la FIFO.
#
# Paramètres : ConfigMap otlp-producer-config (kustomization.yaml), ou
# scripts/produce.sh --events … --count … --interval … --campaign-id …
apiVersion: batch/v1
kind: Job
metadata:
  name: otlp-producer
  labels:
    app.kubernetes.io/name: otlp-producer
    app.kubernetes.io/component: producer
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otlp-producer
        app.kubernetes.io/component: producer
        edot-integration-test/kafka-client: "true"
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Sur le nœud du broker si possible : image Kafka déjà présente.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: python:3.12.15-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkfifo /shared/events
              exec python3 -B /app/produce_otlp.py --output /shared/events \
                --events "$EVENTS" --count "$COUNT" --interval "$INTERVAL" \
                ${CAMPAIGN_ID:+--campaign-id "$CAMPAIGN_ID"} \
                --bootstrap "$BOOTSTRAP" --topic "$TOPIC"
          envFrom:
            - configMapRef:
                name: otlp-producer-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext: &restricted
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: shared
              mountPath: /shared
        - name: producer
          image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              for i in $(seq 1 120); do [[ -p /shared/events ]] && break; sleep 1; done
              exec /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "$BOOTSTRAP" --topic "$TOPIC" \
                --property parse.key=true --property key.separator=$'\t' \
                --producer-property acks=all < /shared/events
          envFrom:
            - configMapRef:
                name: otlp-producer-config
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx128m"
            - name: LOG_DIR
              value: /tmp/kafka-logs
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext: *restricted
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: otlp-producer-script
        - name: shared
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
