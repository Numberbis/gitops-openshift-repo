apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Le Secret elasticsearch-test-credentials n'est PAS ici : créé hors Git, avec
# des valeurs aléatoires, par scripts/create-secrets.sh (README §5.2).
resources:
  - services.yaml
  - statefulset.yaml
  - setup-job.yaml

configMapGenerator:
  # Suffixe de hash conservé : une modification redémarre le nœud.
  - name: elasticsearch-config
    files:
      - elasticsearch.yml
      - jvm-test.options
  - name: elasticsearch-setup-script
    options:
      disableNameSuffixHash: true
    files:
      - setup.sh
