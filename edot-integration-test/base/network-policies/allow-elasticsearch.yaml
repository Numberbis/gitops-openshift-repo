# Clients autorisés → Elasticsearch :9200.
#
# Label edot-integration-test/elasticsearch-client=true :
#   * EDOT Collector de test (écriture, utilisateur edot-integration-test) ;
#   * Job elasticsearch-setup.
# Les tests (tests/validate_pipeline.py) interrogent Elasticsearch par
# « kubectl port-forward », qui passe par le kubelet et ne traverse pas ces
# règles. Elasticsearch n'a aucun flux sortant (GeoIP désactivé).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch-ingress
  labels:
    network-policy-phase: allow
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - elasticsearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: edot-integration-test/elasticsearch-client
                operator: In
                values:
                  - "true"
      ports:
        - protocol: TCP
          port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch-egress
  labels:
    network-policy-phase: allow
spec:
  podSelector:
    matchExpressions:
      - key: edot-integration-test/elasticsearch-client
        operator: In
        values:
          - "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - elasticsearch
      ports:
        - protocol: TCP
          port: 9200
