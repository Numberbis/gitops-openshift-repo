# Clients autorisés → Kafka :9092.
#
# Un pod est client s'il porte le label edot-integration-test/kafka-client=true :
#   * EDOT Collector de test (podLabels de edot/values-test.yaml) ;
#   * Job kafka-topic-init, Job producteur (producer/), pod client éphémère
#     des tests (tests/validate_pipeline.py).
# Le listener CONTROLLER (9093) n'écoute que sur la boucle locale du broker :
# il n'est pas ouvert.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  labels:
    network-policy-phase: allow
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: edot-integration-test/kafka-client
                operator: In
                values:
                  - "true"
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-egress
  labels:
    network-policy-phase: allow
spec:
  podSelector:
    matchExpressions:
      - key: edot-integration-test/kafka-client
        operator: In
        values:
          - "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - kafka
      ports:
        - protocol: TCP
          port: 9092
