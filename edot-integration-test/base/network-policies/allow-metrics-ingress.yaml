# Prometheus → EDOT Collector de test :8888 (/metrics, ServiceMonitor du chart).
#   * namespace monitoring : kube-prometheus-stack de ce dépôt ;
#   * namespace openshift-user-workload-monitoring : supervision des projets
#     utilisateur d'OpenShift.
# Kafka et Elasticsearch n'exposent pas de métriques Prometheus (aucun
# exporter déployé) : leur consommation CPU/mémoire/disque est mesurée par
# cAdvisor/kubelet, sans flux vers les pods (README §9).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  labels:
    network-policy-phase: allow
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - edot-collector-test
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - monitoring
                  - openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8888
