# Création idempotente du topic de test (script topic-init.sh).
#
# Argo CD : hook PostSync, recréé à chaque synchronisation (le précédent est
# supprimé avant). kubectl / scripts/deploy.sh : le script supprime le Job
# précédent puis l'applique de nouveau. Le Job attend lui-même le broker.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  labels:
    app.kubernetes.io/name: kafka-topic-init
    app.kubernetes.io/component: setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topic-init
        app.kubernetes.io/component: setup
        # Autorisé à joindre Kafka (network-policies/).
        edot-integration-test/kafka-client: "true"
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Sur le nœud du pod kafka si possible : l'image Kafka y est déjà
      # présente (pas de second téléchargement).
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: topic-init
          image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/topic-init.sh"]
          envFrom:
            - configMapRef:
                name: kafka-topic-config
          env:
            # Outils en ligne de commande : petite heap.
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx128m"
            - name: LOG_DIR
              value: /tmp/kafka-logs
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: kafka-topic-init-script
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
