# =============================================================================
# Kafka 4.3.2 — broker de TEST, mode KRaft, nœud unique broker + controller
# =============================================================================
# Environnement edot-integration-test UNIQUEMENT (README.md). Aucune haute
# disponibilité, aucune réplication, aucun TLS ni SASL : le broker n'est
# joignable que depuis les pods du namespace autorisés par les NetworkPolicies
# (network-policies/), jamais depuis l'extérieur du cluster.
#
# Fichier lu directement par kafka-server-start.sh (le wrapper Docker de
# l'image, qui réécrit /opt/kafka/config, n'est PAS utilisé : ce répertoire
# n'est pas inscriptible avec un UID arbitraire OpenShift ni avec un rootfs en
# lecture seule).

# ── KRaft : un seul nœud, à la fois broker et controller (pas de ZooKeeper) ──
process.roles=broker,controller
node.id=1
# Quorum STATIQUE d'un seul votant, joint en local : le listener CONTROLLER
# n'écoute que sur la boucle locale du pod.
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER

# ── Listeners ─────────────────────────────────────────────────────────────────
# PLAINTEXT : clients (EDOT, Jobs, tests), sur toutes les interfaces du pod.
# advertised.listeners : adresse renvoyée aux clients après le bootstrap. Avec
# un broker unique, le Service ClusterIP « kafka » suffit (pas d'adresse par
# pod). À ADAPTER si le namespace change (le nom complet y figure).
listeners=PLAINTEXT://:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://kafka.edot-integration-test.svc.cluster.local:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# ── Stockage (PVC monté sur /var/lib/kafka/data) ──────────────────────────────
# Sous-répertoire : la racine d'un volume ext4 contient lost+found.
log.dirs=/var/lib/kafka/data/kraft

# ── Réplication : facteur 1 partout (un seul broker) ─────────────────────────
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
offsets.topic.num.partitions=10
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# ── Topics ────────────────────────────────────────────────────────────────────
# Création explicite uniquement (Job kafka-topic-init) : une faute de frappe
# dans un nom de topic échoue au lieu de créer un topic fantôme.
auto.create.topics.enable=false
num.partitions=1
# Rétention par défaut : 6 h (le topic de test la fixe aussi explicitement).
log.retention.hours=6
log.retention.check.interval.ms=300000
# Segments de 64 Mio : la rétention peut supprimer des segments sur un petit
# volume (une rétention ne s'applique qu'aux segments fermés).
log.segment.bytes=67108864

# ── Consumer groups ───────────────────────────────────────────────────────────
# Pas d'attente au premier rebalance : le Collector de test consomme aussitôt.
group.initial.rebalance.delay.ms=0

# ── Faible empreinte ──────────────────────────────────────────────────────────
num.network.threads=2
num.io.threads=4
num.recovery.threads.per.data.dir=1
background.threads=4
