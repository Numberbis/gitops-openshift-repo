apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Clés du Secret elasticsearch-test-credentials utilisées ici
# (kibana-system-password, kibana-encryption-key) : créées hors Git par
# scripts/create-secrets.sh, comme les autres (README §5.2).
resources:
  - services.yaml
  - deployment.yaml
  - setup-job.yaml

configMapGenerator:
  # Suffixe de hash conservé : une modification redémarre Kibana.
  - name: kibana-config
    files:
      - kibana.yml
  - name: kibana-scripts
    options:
      disableNameSuffixHash: true
    files:
      - init-kibana-system.sh
      - kibana-setup.sh
