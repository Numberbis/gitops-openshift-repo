# Vue de données par défaut (kibana-setup.sh). Hook PostSync Argo CD comme
# kafka-topic-init et elasticsearch-setup : exécuté une fois Kibana sain,
# recréé à chaque synchronisation (le précédent est supprimé avant).
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  labels:
    app.kubernetes.io/name: kibana-setup
    app.kubernetes.io/component: setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana-setup
        app.kubernetes.io/component: setup
        edot-integration-test/kibana-client: "true"
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.elastic.co/kibana/kibana:9.5.6@sha256:c7ed45da5c3cfea020fc6c99ce027f4d21d19dab330379c5115d5eb95f6ecebc
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/kibana-setup.sh"]
          env:
            - name: KIBANA_URL
              value: http://kibana.edot-integration-test.svc.cluster.local:5601
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-test-credentials
                  key: elastic-password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: kibana-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
