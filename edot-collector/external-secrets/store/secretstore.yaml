# Généré par scripts/vault-secrets.py render depuis infra/manual/external-secrets/inventory.yaml
# NE PAS ÉDITER : modifier l'inventaire puis relancer `render`.
#
# Accès Vault du seul namespace edot. La policy Vault eso-edot
# ne permet de lire que secret/data/kubernetes/edot/* (+ les secrets
# partagés explicitement référencés) : un ExternalSecret de ce namespace ne
# peut pas lire les secrets d'une autre application.
#
# Vault en HTTPS, certificat vérifié avec la CA interne (caBundle) :
# docs/security/vault-tls.md.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: edot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      # vault-active : le leader Raft. Le Service « vault » inclut les pods
      # scellés (Ready par sealedcode=204) qui répondent 503.
      server: "https://vault-active.vault.svc.cluster.local:8200"
      # CA interne de Vault (infra/vault/tls/), certificat public.
      caBundle: ""
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-edot"
          serviceAccountRef:
            name: eso-vault
            audiences:
              - vault
