# Généré par scripts/vault-secrets.py render depuis infra/manual/external-secrets/inventory.yaml
# NE PAS ÉDITER : modifier l'inventaire puis relancer `render`.
#
# Identité présentée à Vault par le SecretStore « vault ».
# Aucun pod ne l'utilise : ESO obtient pour elle un jeton court
# (TokenRequest, audience « vault ») à chaque connexion. Le rôle Vault
# eso-edot n'accepte QUE ce compte, dans CE namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: edot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
