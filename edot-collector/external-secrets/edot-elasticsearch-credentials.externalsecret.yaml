# Généré par scripts/vault-secrets.py render depuis infra/manual/external-secrets/inventory.yaml
# NE PAS ÉDITER : modifier l'inventaire puis relancer `render`.
#
# Secret       : edot/edot-elasticsearch-credentials (Opaque)
# Vault        : secret/kubernetes/edot/edot-elasticsearch-credentials — clés : api-key, ca.crt
# Consommateurs: StatefulSet/edot-collector (env ELASTICSEARCH_API_KEY ; volume /etc/edot/elasticsearch)
#
# creationPolicy Orphan : aucune ownerReference. Supprimer cet ExternalSecret
# (ou retirer le répertoire de la kustomization, ce qu'Argo CD « prune »)
# LAISSE le Secret en place : aucune perte de credentials.
# deletionPolicy Retain : un secret supprimé dans Vault ne vide pas le Secret.
# Toutes les clés sont listées : ESO réécrit le Secret ENTIER, une clé absente
# d'ici disparaîtrait du Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edot-elasticsearch-credentials
  namespace: edot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: edot-elasticsearch-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: kubernetes/edot/edot-elasticsearch-credentials
        property: api-key
    - secretKey: ca.crt
      remoteRef:
        key: kubernetes/edot/edot-elasticsearch-credentials
        property: ca.crt
