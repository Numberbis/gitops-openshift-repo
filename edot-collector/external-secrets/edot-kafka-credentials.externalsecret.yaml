# Maintenu À LA MAIN dans ce dépôt (le générateur scripts/vault-secrets.py du
# dépôt d'origine n'est pas présent ici).
#
# Secret       : edot/edot-kafka-credentials (Opaque)
# Vault        : secret/kubernetes/edot/edot-kafka-credentials — clés : ca.crt, tls.crt, tls.key
#                  ca.crt  : CA des BROKERS Kafka (PEM, chaîne complète)
#                  tls.crt : certificat CLIENT d'EDOT + intermédiaires (mTLS ; son DN = principal des ACL)
#                  tls.key : clé privée PEM PKCS#8 NON chiffrée
# Consommateurs: StatefulSet/edot-collector (volume /etc/edot/kafka)
# Alimentation et rotation : docs/tutoriel-connexions-kafka-elasticsearch.md §A4, annexe 1.
#
# creationPolicy Orphan : aucune ownerReference. Supprimer cet ExternalSecret
# (ou retirer le répertoire de la kustomization, ce qu'Argo CD « prune »)
# LAISSE le Secret en place : aucune perte de credentials.
# deletionPolicy Retain : un secret supprimé dans Vault ne vide pas le Secret.
# Toutes les clés sont listées : ESO réécrit le Secret ENTIER, une clé absente
# d'ici disparaîtrait du Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edot-kafka-credentials
  namespace: edot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: edot-kafka-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: kubernetes/edot/edot-kafka-credentials
        property: ca.crt
    - secretKey: tls.crt
      remoteRef:
        key: kubernetes/edot/edot-kafka-credentials
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: kubernetes/edot/edot-kafka-credentials
        property: tls.key
