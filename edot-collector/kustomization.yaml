apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ressources de l'Application edot-collector hors chart
# (argocd/applications/infra/edot-collector.yaml) :
#   * ExternalSecrets + SecretStore Vault (générés par scripts/vault-secrets.py
#     render depuis infra/manual/external-secrets/inventory.yaml) ;
#   * alertes Prometheus ;
#   * dashboard Grafana (ConfigMap dans le namespace monitoring) ;
#   * NetworkPolicies du namespace edot.
#
# Le namespace n'a jamais hébergé de Secret : les ExternalSecrets sont
# référencés directement (phase C de docs/security/secrets-migration.md, pas
# de Secret existant à comparer).
#
# NON inclus (volontairement) : values*.yaml (lus par le chart via $values),
# tests/ (scripts et banc local, lancés à la main), README.md, TODO.md.
resources:
  - external-secrets
  - prometheusrule.yaml
  - network-policies
  # Dashboard Grafana (dashboards/kustomization.yaml). Tant que l'environnement
  # de test le publie (infra/edot-integration-test/overlays/kubernetes), l'y
  # retirer avant de déployer cette Application : un seul propriétaire.
  - dashboards
